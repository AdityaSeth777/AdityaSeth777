<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240">
  
  <defs>
    <filter id="bake-blur-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain-light">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="5" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="page-clip-light">
      <rect x="0" y="0" width="460" height="240" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#page-clip-light)">
    <rect x="0" y="0" width="460" height="240" fill="#F4EDE3"/>
    <g filter="url(#bake-blur-light)"><circle cx="69.0" cy="48.0" r="128.8" fill="#F2A65A" opacity="0.32"/><circle cx="345.0" cy="72.0" r="128.8" fill="#E76F51" opacity="0.32"/><circle cx="207.0" cy="192.0" r="128.8" fill="#8AB6C1" opacity="0.32"/></g>
    <rect x="0" y="0" width="460" height="240" filter="url(#grain-light)" opacity="0.5"/>
  </g>

  <foreignObject x="0" y="0" width="460" height="240">
    
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
        
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .tile {
      background: rgba(255,255,255,0.45);
      border: 1px solid rgba(255,255,255,0.7);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(120,72,30,0.18), inset 0 1px 0 rgba(255,255,255,0.6);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      color: #1E1A16;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .label {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: #7A7168;
    }
    .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .value.accent { color: #E76F51; }
    .value.accent2 { color: #3E8C97; }
    .pill {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: #3E8C97;
      background: color-mix(in srgb, #3E8C97 16%, transparent);
      border: 1px solid color-mix(in srgb, #3E8C97 40%, transparent);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .safelight {
      width: 8px; height: 8px; border-radius: 50%;
      background: #D7263D;
      box-shadow: 0 0 8px #D7263D;
      display: inline-block;
    }

        .wrap { width: 460px; height: 240px; padding: 16px 20px; }
        .tile { width: 100%; height: 100%; }
        .bar-row { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
        .bar-label {
          font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace; font-size: 11px; color: #7A7168;
          width: 78px; flex-shrink: 0; text-align: right;
        }
        .bar-track { flex: 1; height: 10px; background: rgba(128,128,128,0.15); border-radius: 4px; overflow: hidden; }
        .bar-fill { height: 100%; border-radius: 4px; }
      </style>
      <div class="tile">
        <div class="label">language mix &#8212; by repo count</div>
        <div style="margin-top: 12px;">
        <div class="bar-row">
          <span class="bar-label">Python</span>
          <div class="bar-track">
            <div class="bar-fill" style="width: 100.0%; background: #E76F51;"></div>
          </div>
        </div>
        
        <div class="bar-row">
          <span class="bar-label">JavaScript</span>
          <div class="bar-track">
            <div class="bar-fill" style="width: 53.8%; background: #6FB7C9;"></div>
          </div>
        </div>
        
        <div class="bar-row">
          <span class="bar-label">C</span>
          <div class="bar-track">
            <div class="bar-fill" style="width: 38.5%; background: #F2A65A;"></div>
          </div>
        </div>
        
        <div class="bar-row">
          <span class="bar-label">TypeScript</span>
          <div class="bar-track">
            <div class="bar-fill" style="width: 38.5%; background: #8AB6C1;"></div>
          </div>
        </div>
        
        <div class="bar-row">
          <span class="bar-label">HTML</span>
          <div class="bar-track">
            <div class="bar-fill" style="width: 30.8%; background: #D7263D;"></div>
          </div>
        </div>
        
        <div class="bar-row">
          <span class="bar-label">C++</span>
          <div class="bar-track">
            <div class="bar-fill" style="width: 15.4%; background: #9A958C;"></div>
          </div>
        </div>
        </div>
      </div>
    </div>
    
  </foreignObject>
</svg>
