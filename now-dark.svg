<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240">
  
  <defs>
    <filter id="bake-blur-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain-dark">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="page-clip-dark">
      <rect x="0" y="0" width="460" height="240" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#page-clip-dark)">
    <rect x="0" y="0" width="460" height="240" fill="#0E1116"/>
    <g filter="url(#bake-blur-dark)"><circle cx="69.0" cy="48.0" r="128.8" fill="#E8A04A" opacity="0.32"/><circle cx="345.0" cy="72.0" r="128.8" fill="#2F6F73" opacity="0.32"/><circle cx="207.0" cy="192.0" r="128.8" fill="#3B3F6B" opacity="0.32"/></g>
    <rect x="0" y="0" width="460" height="240" filter="url(#grain-dark)" opacity="0.5"/>
  </g>

  <foreignObject x="0" y="0" width="460" height="240">
    
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        .wrap {
          width: 460px; height: 240px;
          background: rgba(255,244,230,0.06);
          border: 1px solid rgba(255,236,210,0.14);
          border-radius: 16px;
          box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
          padding: 16px 20px;
          font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
          font-size: 12.5px;
          color: #EDE6DA;
          overflow: hidden;
        }
        .row {
          opacity: 0;
          animation: reveal 0.01s linear forwards;
          margin-bottom: 10px;
          line-height: 1.45;
        }
        @keyframes reveal { to { opacity: 1; } }
        .prompt { color: #6FB7C9; display: block; }
        .out { color: #EDE6DA; display: block; margin-top: 2px; }
        .cursor {
          display: inline-block; width: 7px; height: 14px;
          background: #E8A04A;
          animation: blink 1s steps(1) infinite;
          margin-left: 4px; vertical-align: text-bottom;
        }
        @keyframes blink { 50% { opacity: 0; } }
      </style>
      <div class="term">
        
        <div class="row" style="animation-delay: 0s;">
          <span class="prompt">$ whoami</span>
          <span class="out">aditya-seth</span>
        </div>
        
        <div class="row" style="animation-delay: 1.1s;">
          <span class="prompt">$ cat focus.txt</span>
          <span class="out">Cloud architecture &amp; AI systems at Techno India Group, research at IIT Roorkee</span>
        </div>
        
        <div class="row" style="animation-delay: 2.2s;">
          <span class="prompt">$ cat reading.txt</span>
          <span class="out">—</span>
        </div>
        
        <div class="row" style="animation-delay: 3.3000000000000003s;">
          <span class="prompt">$ cat last_trip.txt</span>
          <span class="out">—</span>
        </div>
        
        <span class="cursor"></span>
      </div>
    </div>
    
  </foreignObject>
</svg>
