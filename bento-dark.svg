<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340">
  
  <defs>
    <filter id="bake-blur-dark" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="grain-dark">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="1" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.06"/></feComponentTransfer>
      <feComposite operator="over" in2="SourceGraphic"/>
    </filter>
    <clipPath id="page-clip-dark">
      <rect x="0" y="0" width="900" height="340" rx="20"/>
    </clipPath>
  </defs>
  <g clip-path="url(#page-clip-dark)">
    <rect x="0" y="0" width="900" height="340" fill="#0E1116"/>
    <g filter="url(#bake-blur-dark)"><circle cx="135.0" cy="68.0" r="252.00000000000003" fill="#E8A04A" opacity="0.32"/><circle cx="675.0" cy="102.0" r="252.00000000000003" fill="#2F6F73" opacity="0.32"/><circle cx="405.0" cy="272.0" r="252.00000000000003" fill="#3B3F6B" opacity="0.32"/></g>
    <rect x="0" y="0" width="900" height="340" filter="url(#grain-dark)" opacity="0.5"/>
  </g>

  <foreignObject x="0" y="0" width="900" height="340">
    
    <div xmlns="http://www.w3.org/1999/xhtml" class="wrap">
      <style>
        
    * { box-sizing: border-box; margin: 0; padding: 0; }
    .tile {
      background: rgba(255,244,230,0.06);
      border: 1px solid rgba(255,236,210,0.14);
      border-radius: 16px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.18);
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      overflow: hidden;
      color: #EDE6DA;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    .label {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: #9A958C;
    }
    .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
    .value.accent { color: #E8A04A; }
    .value.accent2 { color: #6FB7C9; }
    .pill {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
      font-size: 11px;
      color: #6FB7C9;
      background: color-mix(in srgb, #6FB7C9 16%, transparent);
      border: 1px solid color-mix(in srgb, #6FB7C9 40%, transparent);
      border-radius: 999px;
      padding: 3px 10px;
    }
    .safelight {
      width: 8px; height: 8px; border-radius: 50%;
      background: #D7263D;
      box-shadow: 0 0 8px #D7263D;
      display: inline-block;
    }

        .wrap { width: 900px; height: 340px; padding: 18px; }
        .grid {
          display: grid;
          grid-template-columns: 1.7fr 1fr 1fr;
          grid-template-rows: 1fr 1fr;
          gap: 12px;
          width: 100%;
          height: 100%;
        }
        .identity { grid-row: span 2; justify-content: center; }
        .name { font-size: 27px; font-weight: 600; letter-spacing: -0.01em; display: flex; align-items: center; gap: 8px; }
        .role { margin-top: 6px; font-size: 13px; color: #9A958C; line-height: 1.5; max-width: 34ch; }
        .focus-row { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
        .now .sub { font-size: 11.5px; color: #9A958C; margin-top: 2px; }
      </style>
      <div class="grid">
        <div class="tile identity">
          <div class="name"><span class="safelight"></span> Aditya Seth</div>
          <div class="role">Software Engineer, Cloud Architect &amp; AI Researcher</div>
          <div class="focus-row"><span class="pill">CI/CD &amp; Automation</span><span class="pill">Big Data &amp; Streaming</span><span class="pill">Cloud &amp; Observability</span></div>
        </div>
        <div class="tile since">
          <div class="label">on github for</div>
          <div class="value accent">1,544 days</div>
        </div>
        <div class="tile signal">
          <div class="label">followers &#183; stars</div>
          <div class="value accent2">162 &#183; 168</div>
        </div>
        <div class="tile repos">
          <div class="label">public repos</div>
          <div class="value accent">58</div>
        </div>
        <div class="tile now">
          <div class="label">Kolkata / IST</div>
          <div class="value">08:19</div>
          <div class="sub">Sun, 27 Sep</div>
        </div>
      </div>
    </div>
    
  </foreignObject>
</svg>
