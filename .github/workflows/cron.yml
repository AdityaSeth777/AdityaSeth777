name: Cron Updater
on:
  # push:
  #   branch: [ master ]
  schedule:
    - cron: '5 0 * * *'
  workflow_dispatch:
jobs:
  release:
    name: Cron Updater
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.METRICS_TOKEN }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Requests
        run: |
          pip install requests
      # - name: Install YAML
      #   run: |
      #     pip install pyyaml
      #   env:
      #     key: ${{ secrets.key }}
      - name: Git Config
        run: |
          git config user.name AdityaSeth777
          git config user.email adityaseth.cse@gmail.com
          git pull
      - name: Update Cron
        run: |
          python cron.py
        env:
          key: ${{ secrets.key }}
      - name: Commit
        run: |
          git add -A .
          git diff --staged --quiet && echo "nothing to commit" && exit 0
          git commit -m "Don't check my activity. My main commits are private."
      - name: Push
        # Other scheduled workflows commit to this same branch, so the ref can
        # move between the pull above and this push. Rebase and retry instead
        # of failing the run.
        run: |
          for i in 1 2 3 4 5; do
            git push && exit 0
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase --autostash || exit 1
            sleep $((i * 3))
          done
          echo "push still failing after 5 attempts" && exit 1