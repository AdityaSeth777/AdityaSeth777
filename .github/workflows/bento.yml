name: Bento Tiles

on:
  schedule:
    - cron: "0 */3 * * *"
  push:
    branches: [main]
    paths:
      - "data/**"
      - "photos/**"
      - "scripts/**"
      - ".github/workflows/bento.yml"
  workflow_dispatch:

concurrency:
  group: bento-tiles
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate tiles
        working-directory: scripts
        env:
          # The default token is enough for public-data reads and raises the
          # GitHub API rate limit from 60/hr to 5000/hr.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_bento.py
          python generate_photos.py
          python generate_now.py
          python generate_weather.py
          python generate_histogram.py
          python generate_travel.py
          python generate_guestbook.py
          python generate_poll.py
          mv *.svg ..

      - name: Commit if changed
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -- '*.svg'
          if git diff --cached --quiet; then
            echo "No visual changes, skipping commit"
            exit 0
          fi
          git commit -m "Update bento tiles"
          git pull --rebase origin main
          git push
