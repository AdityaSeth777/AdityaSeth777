name: Metrics

on:
  # push:
  #   branches:
  #     - main
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    name: Main Workflow 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # - name: Most used (with details)
      #   uses: lowlighter/metrics@v3.34
      #   with:
      #     filename: metrics.plugin.languages.details.svg
      #     token: ${{ secrets.METRICS_TOKEN }}
      #     base: ""
      #     plugin_languages: yes
      #     plugin_languages_details: bytes-size, percentage
      #     plugin_languages_ignored: javascript
      #     plugin_languages_colors: 0:#00ff00, 1:#ff0000, 2:#0000ff, 3:#ffff00, 4:#00ffff, 5:#ff00ff, 6:#ffffff, 7:#000000
      #     plugin_languages_limit: 10
      - name: Followers
        uses: lowlighter/metrics@v3.34
        continue-on-error: true
        with:
          filename: followers.svg
          token: ${{ secrets.METRICS_TOKEN }}
          base: ""
          plugin_people: yes
          # The plugin pages the API 100 at a time, then splices the result
          # down to this limit, so 100 was the only thing capping the card.
          # Headroom for growth; it costs one extra request per 100 followers.
          plugin_people_limit: 500
          plugin_people_types: followers